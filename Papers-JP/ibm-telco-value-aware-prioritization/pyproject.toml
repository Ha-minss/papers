[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibm-telco-value-aware-prioritization"
version = "1.0.0"
description = "Leakage-controlled churn modeling and CLTV-weighted fixed-capacity prioritization."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Dongha Park", email = "ehdgk0725@gmail.com"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "lightgbm>=4.1,<5",
  "catboost>=1.2,<2",
  "optuna>=3.6,<5",
  "shap>=0.45,<1",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
  "openpyxl>=3.1,<4",
  "joblib>=1.3,<2",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
ibm-telco-value = "telco_churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
