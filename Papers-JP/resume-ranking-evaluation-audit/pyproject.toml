[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shore-resume-ranking-audit"
version = "0.1.0"
description = "Funnel-aware evaluation audit for resume-job ranking systems"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.10",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.4",
  "transformers==4.57.6",
  "sentence-transformers==5.6.0",
  "datasets>=3.0,<5.0",
  "accelerate>=1.2,<2.0",
  "huggingface-hub>=0.30,<2.0",
  "jieba>=0.42.1",
  "pyarrow>=15.0",
  "tqdm>=4.66",
  "psutil>=5.9",
]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
