[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerrec-paper"
version = "1.0.0"
description = "Reproduction code for a chronological hybrid job recommendation study"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Dongha Park", email = "ehdgk0725@gmail.com"}
]
keywords = ["job recommendation", "recommender systems", "e-recruitment", "NLP", "implicit feedback"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<25",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
full = [
  "sentence-transformers>=3,<6",
  "bm25s>=0.2,<1",
  "PyStemmer>=2,<3",
  "implicit>=0.7,<1"
]
dev = [
  "pytest>=8,<10",
  "build>=1,<2"
]

[project.scripts]
careerrec = "careerrec.cli:main"

[project.urls]
Repository = "https://github.com/Ha-minss/papers/tree/main/careerbuilder-job-recommendation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

